<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0a1122" />
    </linearGradient>

    <!-- Glowing cyan gradient for the main hexagon strokes -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Soft glow filter for elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark launcher background with high rounded corners -->
  <rect width="512" height="512" rx="140" fill="url(#bg)" />

  <!-- Outer concentric dotted circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#22365c" stroke-width="2" stroke-dasharray="2 10" opacity="0.8" />

  <!-- Inner concentric dotted circle -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#22365c" stroke-width="2" stroke-dasharray="2 10" opacity="0.8" />

  <!-- Top floating cyan dot -->
  <circle cx="256" cy="128" r="7.5" fill="#00f3ff" filter="url(#subtle-glow)" />

  <!-- Bottom floating cyan dot -->
  <circle cx="256" cy="384" r="7.5" fill="#00f3ff" filter="url(#subtle-glow)" />

  <!-- Overlapping Hexagon 1 (Top) -->
  <polygon points="186,165 326,165 370,220 326,275 186,275 142,220" 
           fill="rgba(0, 243, 255, 0.04)" 
           stroke="url(#cyan-glow)" 
           stroke-width="12" 
           stroke-linecap="round" 
           stroke-linejoin="round"
           filter="url(#glow)" />

  <!-- Overlapping Hexagon 2 (Bottom) -->
  <polygon points="186,237 326,237 370,292 326,347 186,347 142,292" 
           fill="rgba(0, 243, 255, 0.04)" 
           stroke="url(#cyan-glow)" 
           stroke-width="12" 
           stroke-linecap="round" 
           stroke-linejoin="round"
           filter="url(#glow)" />
</svg>
